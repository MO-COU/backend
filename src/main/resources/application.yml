spring:
  application:
    name: mocou-backend
  profiles:
    active: local
  flyway:
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health, info

mocou:
  lifecycle:
    expiration:
      # 만료 배치 설정의 기본값은 이 파일 한 곳에서만 관리한다. true면 자동 실행, false면 자동 실행 중지.
      scheduler-enabled: true
      # 자동 실행이 켜진 경우의 실행 간격(ms). 부하 테스트에서는 필요에 따라 짧게 조정한다.
      fixed-delay-ms: 60000
      # 한 번의 트랜잭션에서 처리할 최대 만료 후보 수.
      chunk-size: 2000
  consistency:
    # 규칙당 저장할 위반 상세 건수. 집계에는 전체 위반 수가 기록되고 이 값은 목록에만 걸린다.
    violation-limit: 1000
    # 만료 유예를 만료 배치 주기의 몇 배로 둘지. 절대 시간이 아니라 배수라 주기를 바꿔도 따라간다.
    grace-multiplier: 5
    # 이 시간이 지나도 끝나지 않은 실행은 죽은 것으로 보고 새 검증을 허용한다.
    # 300만 건 전량 검증이 약 90초다. 도중에 프로세스가 죽으면 시작 기록이 진행 중으로 남는데,
    # 이 시간이 지나야 다시 실행할 수 있으므로 실측의 3배 남짓으로 둔다.
    stale-run-minutes: 5
