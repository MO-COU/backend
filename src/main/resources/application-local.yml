# docker-compose(로컬)용 공용 설정 - 팀 전체가 동일하게 사용, 시크릿 없음
spring:
  datasource:
    # rewriteBatchedStatements: JDBC 배치를 실제 multi-row INSERT로 합쳐 전송한다.
    # 끄면 batchUpdate로 묶어도 드라이버가 문장을 건별로 보내 왕복 비용이 그대로 남는다.
    url: jdbc:mysql://localhost:3306/mocou?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: mocou
    password: mocou
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.mocou: DEBUG

mocou:
  cors:
    # Vite dev server 기본 포트. 프론트가 다른 포트를 쓰면 여기 맞춰서 바꾼다.
    allowed-origins: http://localhost:5173
