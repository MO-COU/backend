# EC2 배포용 Compose 파일.
# mysql/redis는 app 컨테이너만 같은 docker 네트워크 안에서 서비스명(mysql, redis)으로 접근함.
# 실행 전 .env 파일을 EC2 서버에 올려야 함.

services:
  mysql:
    image: mysql:8.0
    container_name: mocou-mysql
    restart: unless-stopped
    # 버퍼 풀 산정 근거는 #210 참조 — working set(데이터+인덱스 1.5GB) + 회원 300만 확장분.
    # 70% 공식은 앱·Redis와 호스트를 공유하므로 기각. redo 512M은 부하 테스트 INSERT 폭주 시
    # 강제 체크포인트(쓰기 멈춤 스파이크) 예방. sort_buffer 등은 실측 반증으로 제외.
    command:
      - --innodb-buffer-pool-size=4G
      - --innodb-redo-log-capacity=512M
    environment:
      MYSQL_DATABASE: mocou
      MYSQL_USER: mocou
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    container_name: mocou-redis
    restart: unless-stopped
    # everysec/always 실측 비교(20000VU) 결과 처리량 차이 없어 내구성 더 높은 always로 고정 - #216
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dockerfile로 빌드된 이미지
  app:
    image: ghcr.io/mo-cou/backend:latest
    container_name: mocou-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mocou?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: mocou
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MOCOU_NOTIFICATION_DISPATCH_ENABLED: ${MOCOU_NOTIFICATION_DISPATCH_ENABLED:-false}
      # 부하 테스트 실행 API (k6 SSM 연동). k6 EC2는 app EC2와 분리되어 있으므로
      # MOCOU_INSTANCE_ID_K6/MOCOU_K6_TARGET_URL은 기본값 없이 .env에서 반드시 채워야 함.
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      MOCOU_INSTANCE_ID_K6: ${MOCOU_INSTANCE_ID_K6}
      MOCOU_K6_WORK_DIRECTORY: ${MOCOU_K6_WORK_DIRECTORY:-/home/ubuntu/backend}
      MOCOU_K6_TARGET_URL: ${MOCOU_K6_TARGET_URL}

      # Tomcat 동시 연결 한도. 부하테스트 시나리오마다 필요한 값이 달라 코드 배포 없이
      # 이 .env만 바꾸고 재기동(up -d)하면 반영된다. 기본값은 application-prod.yml과 동일.
      #
      # accept-count는 아래 sysctls의 somaxconn과 같은 값(32768)으로 맞춘다. 커널 값이 더
      # 작으면 accept-count가 그 선에서 잘리므로, 한쪽만 올리면 조용히 무효가 된다.
      # threads.max 200은 실측 근거다 - 2만 스파이크에서 200과 400의 p95가 같았고
      # (콜드 6328 vs 6194, 웜 3531 vs 3510ms) 요청 하나가 Redis Lua 수 ms라
      # 스레드가 즉시 반납되기 때문이다. p95를 가르는 것은 스레드가 아니라 JVM 워밍업이었다.
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-30000}
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-32768}
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-200}

      # MySQL 커넥션 풀 크기. MySQL 자체 max_connections(기본 151)를 넘지 않게 잡는다.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-16}

      # 부하테스트 후 Redis→DB 적재 완료 대기 시간(초). 발급량이 클수록 더 걸릴 수 있다.
      MOCOU_LOADTEST_DB_SYNC_TIMEOUT_SECONDS: ${MOCOU_LOADTEST_DB_SYNC_TIMEOUT_SECONDS:-60}

      # issue sync / notification dispatch 튜닝값. 기본값은 application-prod.yml과 동일.
      MOCOU_ISSUE_SYNC_CHUNK_SIZE: ${MOCOU_ISSUE_SYNC_CHUNK_SIZE:-500}
      MOCOU_ISSUE_SYNC_BATCH_WINDOW_MS: ${MOCOU_ISSUE_SYNC_BATCH_WINDOW_MS:-3000}
      MOCOU_ISSUE_SYNC_PENDING_MIN_IDLE_MS: ${MOCOU_ISSUE_SYNC_PENDING_MIN_IDLE_MS:-10000}
      MOCOU_ISSUE_SYNC_DLQ_MAX_DELIVERY_COUNT: ${MOCOU_ISSUE_SYNC_DLQ_MAX_DELIVERY_COUNT:-10}
      MOCOU_ISSUE_SYNC_DLQ_PENDING_MIN_IDLE_MS: ${MOCOU_ISSUE_SYNC_DLQ_PENDING_MIN_IDLE_MS:-60000}
      MOCOU_NOTIFICATION_DISPATCH_BATCH_SIZE: ${MOCOU_NOTIFICATION_DISPATCH_BATCH_SIZE:-500}
      MOCOU_NOTIFICATION_DISPATCH_MIN_DISPATCH_AGE_SECONDS: ${MOCOU_NOTIFICATION_DISPATCH_MIN_DISPATCH_AGE_SECONDS:-3}
    # 컨테이너는 호스트 커널 값을 그대로 쓰지 않고 자기 네트워크 네임스페이스 값을 본다.
    # 여기서 올려주지 않으면 도커 기본값(somaxconn 4096)이 적용되어 accept-count가
    # 커널 단에서 잘린다. 2만 스파이크에서 연결 거절이 나는 지점이라 반드시 필요하다.
    # accept-count와 같은 값으로 맞춘다 - 한쪽만 올리면 다른 쪽이 상한이 되어 무효가 된다.
    sysctls:
      net.core.somaxconn: 32768
      net.ipv4.tcp_max_syn_backlog: 32768
    volumes:
      # Logback 기본 경로(/app/logs)를 named volume에 보관해 앱 컨테이너 교체 뒤에도 오류 로그를 유지한다.
      - app-logs:/app/logs
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
  app-logs:
