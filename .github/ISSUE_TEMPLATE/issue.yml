name: 이슈 등록
description: 기능 추가, 버그 수정, 리팩토링 등 모든 작업 등록
body:
  - type: markdown
    attributes:
      value: |
        1. 맨 아래 Assignee에 본인 등록
        2. 맨 아래 Label 고르기 `Feature` `Bug` `Refactor` `Test` `Docs` `Chore` `Deploy` 선택
        3. 그 값을 브랜치명으로 ex) feature/00-example
        이슈 생성 -> 브랜치 생성 -> 작업 -> PR 생성 -> Merge
  - type: textarea
    id: overview
    attributes:
      label: 개요
      description: 무슨 작업인지, 왜 필요한지 적는다. 버그라면 어떤 상황에서 어떻게 잘못되는지 적는다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 최대한 세분화해서 적고, 작업하면서 체크해 나간다.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: 참고
      description: 재현 방법, 에러 로그, API 명세, 관련 이슈 등
    validations:
      required: false
