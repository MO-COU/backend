# 배포 테스트까지 깃허브 액션 탭에서 중단시켜둘 예정
name: CD

# main에 push될 때 자동실행
# Actions 탭에서 수동 실행 가능
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 빌드한 이미지를 저장할 주소 정의.
# 레지스트리 저장소 경로는 소문자만 허용되므로 고정 소문자로 적는다 (docker-compose.prod.yml과 동일).
env:
  IMAGE: ghcr.io/mo-cou/backend

jobs:
  # 1. build-and-push : 이미지 생성 후 저장소에 올림
  build-and-push:
    runs-on: ubuntu-latest
    # 코드는 읽기만, 패키지(이미지 저장소)는 쓰기 권한 부여
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 로그인 및 GitHub Actions 임시 토큰 자동 발급
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 저장소 루트의 Dockerfile 기준으로 이미지 빌드 및 푸시
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

  # 2. deploy : SSH 대신 AWS SSM Run Command로 EC2에 배포
  # 사전 준비: EC2에 ~/mocou/docker-compose.prod.yml, ~/mocou/.env가 이미 있어야 함
  # (compose 파일은 자주 안 바뀌므로 최초 1회 SSM Session Manager로 직접 올려둔다)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # CD 전용 IAM 자격증명으로 인증 (팀원 개인 SSM 키 사용 금지)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # EC2에 SSH 없이 명령 전달
      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy mocou backend" \
            --parameters '{"commands":[
              "cd ~/mocou",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d",
              "docker image prune -f"
            ]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
