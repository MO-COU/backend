name: CI

# PR/push마다 자동실행되는 코드 검증
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 새로운 커밋 발생 시, 이전 커밋의 돌고있던 CI 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ubuntu-latest 위에서 실행 후 , 15분 넘으면 강제 종료
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 레포지토리 코드를 해당 가상머신으로 다운로드
      - name: Checkout
        uses: actions/checkout@v7

      # JAVA 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Gradlew 관련 캐시 자동 관리
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 명시적으로 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 컴파일 및 테스트 실행
      # Testcontainers가 필요한 MySQL/Redis 컨테이너를 직접 띄움
      - name: Build and test
        run: ./gradlew build

      # CI 실패시에만 실행, 상세 리포트를 Actions에 남김
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
